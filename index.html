<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020706"><title>Zarar Digital Hub</title>
<style>
:root{color-scheme:dark;--bg:#020706;--panel:#101114;--muted:#89879d;--neon:#00f0c0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 10%,#06201b 0,transparent 25%),#020706;color:#f6f5ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.15;background-image:linear-gradient(30deg,transparent 48%,#253b36 49%,transparent 50%),linear-gradient(120deg,transparent 48%,#253b36 49%,transparent 50%);background-size:42px 42px}.wrap{max-width:1050px;margin:auto;padding:24px 18px 100px;position:relative}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:clamp(24px,5vw,38px);font-weight:850;letter-spacing:1px;color:var(--neon);text-shadow:0 0 18px #00eeb944}.sub{color:var(--muted);margin-top:0}.secure{border:1px solid #007c5d;color:var(--neon);padding:9px 14px;border-radius:12px;white-space:nowrap}.panel{background:#0b0d0deF;border:1px solid #222428;border-radius:22px;padding:24px;max-width:480px;margin:65px auto;box-shadow:0 18px 65px #0008}.panel h1{margin:0 0 8px}.panel p{color:var(--muted);line-height:1.5}.field{width:100%;padding:15px 16px;background:#111216;border:1px solid #303037;border-radius:13px;color:white;font-size:16px;outline:none;margin:12px 0}.field:focus{border-color:var(--neon)}button{border:0;border-radius:12px;padding:14px 18px;background:var(--neon);color:#00110d;font-weight:800;font-size:16px;cursor:pointer;width:100%}button:disabled{opacity:.55}.error{color:#ff8585!important;min-height:22px}.section-title{letter-spacing:4px;color:#9a98ae;margin:25px 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.tile{background:linear-gradient(145deg,#141419,#0c0d11);border:1px solid #27272f;border-radius:22px;padding:22px 16px;min-height:145px}.tile .ico{font-size:34px;color:var(--neon);margin-bottom:14px}.tile strong{display:block}.tile p{color:var(--muted);font-size:13px}.hidden{display:none!important}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:3;display:flex;justify-content:space-around;gap:6px;background:#09090cf2;border-top:1px solid #23232a;padding:12px 5px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}.nav{color:var(--muted);font-size:12px;text-align:center;min-width:48px}.nav b{display:block;font-size:23px;margin-bottom:2px}.nav.active{color:var(--neon)}.small{font-size:12px;color:#77758a;text-align:center;margin-top:16px}a{color:var(--neon)}@media(max-width:500px){.wrap{padding:18px 14px 100px}.panel{margin:45px auto;padding:20px}.secure{font-size:12px;padding:8px}}
</style></head><body><main class="wrap"><header class="top"><div><div class="brand">Zarar Digital Hub</div><div class="sub" id="guestLabel">Public Guest</div></div><div class="secure">◈ Secure</div></header>
<section id="login" class="panel"><h1>Access Required</h1><p>Enter your unique access code to open the hub. Codes are verified securely by the server.</p><form id="loginForm"><input class="field" id="code" autocomplete="one-time-code" placeholder="Enter access code" required maxlength="40" aria-label="Access code"><button id="submitBtn" type="submit">Unlock Website →</button><p id="error" class="error" role="alert"></p></form><div class="small">Only authorized users can enter.</div></section>
<section id="hub" class="hidden"><div class="field" style="color:#9b99ad">⌕ &nbsp; Welcome to your digital hub</div><div class="section-title">YOUR MODULES</div><div id="tiles" class="grid"></div><p class="small"><button id="logout" style="max-width:180px;background:#18191e;color:#ddd;border:1px solid #333">Log out</button></p></section></main>
<nav id="bottom" class="bottom hidden"><div class="nav active"><b>‹/›</b>Tools</div><div class="nav"><b>♟</b>APKs</div><div class="nav"><b>✦</b>Courses</div><div class="nav"><b>●</b>Profile</div><div class="nav"><b>♛</b>Premium</div></nav>
<script>
const login=document.getElementById('login'),hub=document.getElementById('hub'),error=document.getElementById('error'),btn=document.getElementById('submitBtn');
function showHub(data){login.classList.add('hidden');hub.classList.remove('hidden');document.getElementById('bottom').classList.remove('hidden');document.getElementById('guestLabel').textContent=data.label||'Authorized Guest';document.getElementById('tiles').innerHTML=data.modules.map(m=>`<article class="tile"><div class="ico">${escapeHtml(m.icon)}</div><strong>${escapeHtml(m.title)}</strong><p>${escapeHtml(m.description)}</p></article>`).join('')}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();error.textContent='';btn.disabled=true;btn.textContent='Checking…';try{const r=await fetch('/api/access',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.getElementById('code').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Access denied');const c=await fetch('/api/content');const content=await c.json();if(!c.ok)throw new Error(content.error||'Could not load hub');showHub(content)}catch(err){error.textContent=err.message||'Could not connect to server.'}finally{btn.disabled=false;btn.textContent='Unlock Website →'}});
document.getElementById('logout').addEventListener('click',async()=>{await fetch('/api/logout',{method:'POST'});hub.classList.add('hidden');document.getElementById('bottom').classList.add('hidden');login.classList.remove('hidden');document.getElementById('code').value='';document.getElementById('guestLabel').textContent='Public Guest'});
</script></body></html>
